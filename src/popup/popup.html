<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Notebooker</title>
  <link rel="stylesheet" href="options.css" />
  <style>
    body { width: 360px; padding: 14px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .page { font-size: 12px; color: var(--muted); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row > * { flex: 1; }
    .status { font-size: 12px; margin-top: 10px; color: var(--muted); min-height: 16px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  </style>
</head>
<body>
  <h1>📚 Notebooker</h1>
  <section>
    <div class="page" id="page"></div>
    <label>Cible
      <select id="target"></select>
    </label>
    <label>Actualisation
      <select id="refresh">
        <option value="0">Ajout unique</option>
        <option value="60">Toutes les heures</option>
        <option value="360">Toutes les 6 h</option>
        <option value="1440" selected>Quotidienne</option>
        <option value="10080">Hebdomadaire</option>
      </select>
    </label>
    <div class="row">
      <button id="add" class="primary">Ajouter cette page</button>
    </div>
    <div class="row">
      <button id="reloadNb">↻ Lister mes notebooks</button>
    </div>
  </section>
  <hr />
  <section>
    <div class="row">
      <button id="brief">☀️ Brief maintenant</button>
      <button id="sync">⟳ Sync sources</button>
    </div>
    <div class="status" id="status"></div>
  </section>
  <hr />
  <a href="options.html" target="_blank">Réglages, abonnements & historique →</a>
  <script src="popup.js"></script>
</body>
</html>
